name: Publish

# Run manually from the Actions tab, on main only. The VS Code Marketplace step
# uses Trusted Publishing (OIDC), so no VSCE_PAT secret exists. It needs a
# policy on the publisher's "Trusted Publishing" page naming this repository
# and this workflow file (publish.yml), with no environment.
on:
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Package
        run: npx --yes @vscode/vsce@4.1.1 package --out r4tsk.vsix
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath r4tsk.vsix
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish r4tsk.vsix
